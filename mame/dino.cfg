<?xml version="1.0"?>
<!-- Cadillacs and Dinosaurs, DualSense through DirectInput (mame -joystickprovider dinput -cfg_directory <this folder>).
     R2 = attack, L2 = attack + jump together, Square = attack (no trigger feel), Cross = jump.
     Button numbers are the usual DirectInput order for a DualSense (1 Square, 2 Cross, 7 L2, 8 R2), written on a Mac
     2026-10-07 and not checked against the PC's own ffight.cfg or a pad. -->
<mameconfig version="10">
    <system name="dino">
        <input>
            <port tag=":IN1" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">JOYCODE_1_BUTTON8 OR JOYCODE_1_BUTTON7 OR JOYCODE_1_BUTTON1</newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON2" mask="32" defvalue="32">
                <newseq type="standard">JOYCODE_1_BUTTON2 OR JOYCODE_1_BUTTON7</newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON1" mask="4096" defvalue="4096">
                <newseq type="standard">JOYCODE_2_BUTTON8 OR JOYCODE_2_BUTTON7 OR JOYCODE_2_BUTTON1</newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON2" mask="8192" defvalue="8192">
                <newseq type="standard">JOYCODE_2_BUTTON2 OR JOYCODE_2_BUTTON7</newseq>
            </port>
        </input>
    </system>
</mameconfig>
